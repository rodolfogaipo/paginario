<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12081F">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Estante — Paginário</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <a href="inicio.html" class="marca"><img src="logo-paginario.png"><span class="display">PAGIN<span>Á</span>RIO</span></a>
  <div class="acoes-topo">
    <span class="link-sair" id="linkSair">Sair</span>
    <a href="estante.html" class="avatar-topo" id="avatarTopo">?</a>
  </div>
</header>

<main>
  <div class="cabecalho-perfil">
    <label class="avatar-grande" id="avatarGrande" style="cursor:pointer;" title="Toque para trocar a foto">
      ?
      <input type="file" id="inputFoto" accept="image/*" style="display:none">
    </label>
    <div>
      <div style="display:flex; align-items:center; gap:8px;">
        <h2 class="display" id="nomeUsuario" style="font-size:21px;">Carregando…</h2>
        <button class="botao-icone" id="botaoEditarNome" title="Editar nome" style="width:28px; height:28px; font-size:11px;">✎</button>
      </div>
      <div class="stats-perfil">
        <div class="pill dourado">Total lido <b id="totalPaginas">0</b> pág.</div>
        <div class="pill">Livros <b id="totalLivros">0</b></div>
      </div>
    </div>
  </div>

  <div class="titulo-secao">
    <div><h3 class="display" style="font-size:17px;">Livros concluídos</h3></div>
  </div>

  <div class="grade-livros" id="grade"><p style="color:var(--texto-suave); font-size:13px;">Carregando…</p></div>
</main>

<nav class="barra-nav-app">
  <a href="inicio.html" class="item-nav-app"><span class="ic">🏠</span>Início</a>
  <a href="estante.html" class="item-nav-app"><span class="ic">📚</span>Estante</a>
  <a href="registrar.html" class="item-nav-app"><span class="ic">✚</span>Registrar</a>
  <a href="clube.html" class="item-nav-app"><span class="ic">🤝</span>Clube</a>
  <a href="ranking.html" class="item-nav-app"><span class="ic">🏆</span>Ranking</a>
</nav>

<div class="veu" id="veuModal" style="display:none"><div class="modal-livro" id="conteudoModal"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('linkSair').addEventListener('click', sair);
let usuarioAtual = null;

exigirLogin(async user=>{
  usuarioAtual = user;
  const perfil = await buscarPerfilUsuario(user.uid);
  preencherPerfil(perfil);
  carregarLivros();
});

function preencherPerfil(perfil){
  document.getElementById('nomeUsuario').textContent = perfil.nome;
  document.getElementById('totalPaginas').textContent = formatarNumero(perfil.totalPaginas);
  document.getElementById('totalLivros').textContent = perfil.livrosConcluidos || 0;
  const av = document.getElementById('avatarGrande');
  const avTopo = document.getElementById('avatarTopo');
  if(perfil.fotoBase64){
    av.innerHTML = `<img src="${perfil.fotoBase64}"><input type="file" id="inputFoto" accept="image/*" style="display:none">`;
    avTopo.innerHTML = `<img src="${perfil.fotoBase64}">`;
  } else {
    av.innerHTML = iniciais(perfil.nome) + '<input type="file" id="inputFoto" accept="image/*" style="display:none">';
    avTopo.innerHTML = iniciais(perfil.nome);
  }
  document.getElementById('inputFoto').addEventListener('change', async e=>{
    const arquivo = e.target.files[0];
    if(!arquivo) return;
    const base64 = await comprimirImagem(arquivo, 240, 0.75);
    await atualizarFotoPerfil(usuarioAtual.uid, base64);
    const p = await buscarPerfilUsuario(usuarioAtual.uid);
    preencherPerfil(p);
  });
}

document.getElementById('botaoEditarNome').addEventListener('click', async ()=>{
  const perfilAtual = await buscarPerfilUsuario(usuarioAtual.uid);
  const novoNome = prompt('Novo nome:', perfilAtual.nome);
  if(novoNome === null || !novoNome.trim()) return;
  await atualizarNomePerfil(usuarioAtual.uid, novoNome.trim());
  const p = await buscarPerfilUsuario(usuarioAtual.uid);
  preencherPerfil(p);
});

async function carregarLivros(){
  const grade = document.getElementById('grade');
  const livros = await buscarLivrosConcluidos(usuarioAtual.uid);
  if(livros.length===0){
    grade.innerHTML = `<div class="vazio" style="grid-column:1/-1"><div class="display" style="font-size:16px;">Sua estante está vazia</div>Finalize seu primeiro livro na aba Registrar.</div>`;
    return;
  }
  grade.innerHTML = livros.map(l=>`
    <div class="capa-livro" data-id="${l.id}">
      ${l.capaBase64?`<img src="${l.capaBase64}">`:`<div class="titulo-mini">${escapeHtml(l.titulo)}</div>`}
      <span class="badge-pag">${formatarNumero(l.paginasTotal)} pág.</span>
    </div>`).join('');
  grade.querySelectorAll('.capa-livro').forEach(el=>{
    el.addEventListener('click', ()=> abrirModal(livros.find(l=>l.id===el.dataset.id)));
  });
}

function abrirModal(livro){
  const veu = document.getElementById('veuModal');
  document.getElementById('conteudoModal').innerHTML = `
    ${livro.capaBase64?`<img class="capa-modal" src="${livro.capaBase64}" onclick="abrirImagemAmpliada('${livro.capaBase64}')"><div class="lupa-capa">🔍</div>`:''}
    <div class="modal-corpo">
      <button class="fechar" id="fecharModal">&times;</button>
      <h2 class="display" style="font-size:20px;">${escapeHtml(livro.titulo)}</h2>
      <div style="color:var(--texto-suave); font-size:13.5px; margin-top:2px;">${escapeHtml(livro.autor)}</div>
      ${livro.resumo?`<p style="margin-top:14px; font-size:14px; line-height:1.6; color:var(--perola);">${escapeHtml(livro.resumo)}</p>`:''}
      ${livro.citacaoPreferida?`<div class="citacao">"${escapeHtml(livro.citacaoPreferida)}"</div>`:''}
      <div class="ficha-tecnica">
        <div>Editora: <b>${escapeHtml(livro.editora)||'—'}</b></div>
        <div>Edição: <b>${escapeHtml(livro.edicao)||'—'}</b></div>
        <div>Páginas: <b>${formatarNumero(livro.paginasTotal)}</b></div>
        <div>Personagem: <b>${escapeHtml(livro.personagemPrincipal)||'—'}</b></div>
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="botao secundario" id="botaoEditarLivro" style="flex:1;">✎ Editar</button>
        <button class="botao vinho" id="botaoExcluirLivro" style="flex:1; background:rgba(225,91,91,0.18); color:#f0a3a3; box-shadow:none;">🗑 Excluir</button>
      </div>
    </div>`;
  veu.style.display = 'flex';
  document.getElementById('fecharModal').addEventListener('click', ()=> veu.style.display='none');
  veu.addEventListener('click', e=>{ if(e.target===veu) veu.style.display='none'; });

  document.getElementById('botaoExcluirLivro').addEventListener('click', async ()=>{
    if(!confirm(`Remover "${livro.titulo}" da sua estante? Isso também tira as páginas dele do seu total.`)) return;
    await removerLivro(livro, usuarioAtual.uid);
    veu.style.display = 'none';
    const p = await buscarPerfilUsuario(usuarioAtual.uid);
    preencherPerfil(p);
    carregarLivros();
  });

  document.getElementById('botaoEditarLivro').addEventListener('click', ()=> abrirModalEdicao(livro));
}

function abrirModalEdicao(livro){
  const veu = document.getElementById('veuModal');
  let novaCapaBase64 = null;
  document.getElementById('conteudoModal').innerHTML = `
    <div class="modal-corpo">
      <button class="fechar" id="fecharModal">&times;</button>
      <h2 class="display" style="font-size:19px; margin-bottom:16px;">Editar livro</h2>

      <div class="campo">
        <label>Capa</label>
        <label class="upload-capa" id="uploadCapaEditar">
          ${livro.capaBase64?`<img src="${livro.capaBase64}">`:'<span>📷 Adicionar capa</span>'}
          <input type="file" id="capaEditar" accept="image/*">
        </label>
      </div>
      <div class="campo"><label>Título</label><input type="text" id="tituloEditar" value="${escapeHtml(livro.titulo)}"></div>
      <div class="campo"><label>Autor</label><input type="text" id="autorEditar" value="${escapeHtml(livro.autor)}"></div>
      <div class="campo-dupla">
        <div class="campo"><label>Editora</label><input type="text" id="editoraEditar" value="${escapeHtml(livro.editora||'')}"></div>
        <div class="campo"><label>Edição</label><input type="text" id="edicaoEditar" value="${escapeHtml(livro.edicao||'')}"></div>
      </div>
      <div class="campo"><label>Total de páginas</label><input type="number" id="paginasEditar" value="${livro.paginasTotal||0}"></div>
      <div class="campo"><label>Personagem principal</label><input type="text" id="personagemEditar" value="${escapeHtml(livro.personagemPrincipal||'')}"></div>
      <div class="campo"><label>Resumo</label><textarea id="resumoEditar">${escapeHtml(livro.resumo||'')}</textarea></div>
      <div class="campo"><label>Citação preferida</label><textarea id="citacaoEditar">${escapeHtml(livro.citacaoPreferida||'')}</textarea></div>

      <button class="botao dourado" id="botaoSalvarEdicao">Salvar alterações</button>
      <div id="erroEditar" class="erro" style="display:none"></div>
    </div>`;
  veu.style.display = 'flex';
  document.getElementById('fecharModal').addEventListener('click', ()=> veu.style.display='none');

  document.getElementById('capaEditar').addEventListener('change', async e=>{
    const arquivo = e.target.files[0];
    if(!arquivo) return;
    novaCapaBase64 = await comprimirImagem(arquivo, 420, 0.72);
  });

  document.getElementById('botaoSalvarEdicao').addEventListener('click', async ()=>{
    const btn = document.getElementById('botaoSalvarEdicao');
    const erroBox = document.getElementById('erroEditar');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try{
      await editarLivro(livro.id, {
        titulo: document.getElementById('tituloEditar').value.trim(),
        autor: document.getElementById('autorEditar').value.trim(),
        editora: document.getElementById('editoraEditar').value.trim(),
        edicao: document.getElementById('edicaoEditar').value.trim(),
        paginasTotal: document.getElementById('paginasEditar').value,
        personagemPrincipal: document.getElementById('personagemEditar').value.trim(),
        resumo: document.getElementById('resumoEditar').value.trim(),
        citacaoPreferida: document.getElementById('citacaoEditar').value.trim(),
        capaBase64: novaCapaBase64
      });
      veu.style.display = 'none';
      carregarLivros();
    } catch(err){
      erroBox.textContent = 'Não foi possível salvar. Tente novamente.';
      erroBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Salvar alterações';
    }
  });
}
</script>
</body>
</html>
