<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Paginário</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <a href="inicio.html" class="marca"><img src="logo-paginario.png"><span class="display">PAGIN<span>Á</span>RIO</span></a>
  <div class="acoes-topo">
    <span class="link-sair" id="linkSair">Sair</span>
    <a href="estante.html" class="avatar-topo" id="avatarTopo">?</a>
  </div>
</header>

<main>
  <div class="titulo-secao">
    <div><h3 class="display" style="font-size:20px;">Ranking geral</h3><p>Ordenado pelo total de páginas lidas</p></div>
  </div>

  <div class="podio" id="podio"></div>
  <div class="lista-ranking" id="listaRanking"><p style="color:var(--texto-suave); font-size:13px;">Carregando…</p></div>
</main>

<nav class="barra-nav-app">
  <a href="inicio.html" class="item-nav-app"><span class="ic">🏠</span>Início</a>
  <a href="estante.html" class="item-nav-app"><span class="ic">📚</span>Estante</a>
  <a href="registrar.html" class="item-nav-app"><span class="ic">✚</span>Registrar</a>
  <a href="clube.html" class="item-nav-app"><span class="ic">🤝</span>Clube</a>
  <a href="ranking.html" class="item-nav-app ativo"><span class="ic">🏆</span>Ranking</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('linkSair').addEventListener('click', sair);

exigirLogin(async user=>{
  const perfil = await buscarPerfilUsuario(user.uid);
  document.getElementById('avatarTopo').innerHTML = perfil.fotoBase64 ? `<img src="${perfil.fotoBase64}">` : iniciais(perfil.nome);

  const ranking = await buscarRanking();
  const podio = document.getElementById('podio');
  const lista = document.getElementById('listaRanking');

  if(ranking.length===0){
    podio.innerHTML = '';
    lista.innerHTML = `<div class="vazio"><div class="display" style="font-size:15px;">Ninguém no ranking ainda</div>Seja o primeiro a registrar uma leitura.</div>`;
    return;
  }

  const maiorValor = Math.max(1, ranking[0]?.totalPaginas||0);
  const top3 = ranking.slice(0,3);
  const ordemExibicao = [top3[1], top3[0], top3[2]];
  podio.innerHTML = ordemExibicao.map((u,i)=>{
    if(!u) return `<div></div>`;
    const medalha = ['2º','1º','3º'][i];
    const classe = ['p2','p1','p3'][i];
    return `<a href="perfil.html?uid=${u.id}" class="pod ${classe}"><div class="medalha">${medalha}</div><div class="nome-pod">${escapeHtml(u.nome)}</div><div class="pag-pod">${formatarNumero(u.totalPaginas)} pág.</div></a>`;
  }).join('');

  lista.innerHTML = ranking.slice(3).map((u,i)=>`
    <a href="perfil.html?uid=${u.id}" class="linha-rank">
      <div class="pos">${i+4}</div>
      <div class="info">
        <div class="nome">${escapeHtml(u.nome)}</div>
        <div class="barra-bg"><div class="barra" style="width:${Math.round((u.totalPaginas/maiorValor)*100)}%"></div></div>
      </div>
      <div class="pag">${formatarNumero(u.totalPaginas)}<small>páginas</small></div>
    </a>`).join('');
});
</script>
</body>
</html>
